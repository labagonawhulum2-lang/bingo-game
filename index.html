<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አብዲ ቢንጎ - Abdi Bingo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1c29;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #24273a;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        h1 { color: #ff9f43; margin-bottom: 5px; }
        .screen { display: none; }
        .active { display: block; }
        
        /* Card Selection styles */
        select {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            margin: 15px 0;
            background: #353954;
            color: white;
        }
        button {
            background-color: #ff9f43;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #f39c12; }
        
        /* Payment Styles */
        .payment-info {
            background: #2f334d;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin: 15px 0;
            font-size: 15px;
        }
        input {
            width: 85%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #484b6a;
            background: #1a1c29;
            color: white;
            margin-bottom: 15px;
            font-size: 16px;
        }

        /* Bingo Board Styles */
        .header-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 22px;
            color: #ff9f43;
        }
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .cell {
            background-color: #353954;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
        }
        .cell.selected {
            background-color: #2ecc71;
            color: white;
            transform: scale(0.95);
        }
        .cell.free {
            background-color: #e74c3c;
            color: white;
        }
        .status-msg {
            margin: 15px 0;
            color: #2ecc71;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="selection-screen" class="screen active">
        <h1>🎰 አብዲ ቢንጎ 🎰</h1>
        <p>ለመጫወት የሚፈልጉትን የካርቴላ ቁጥር ይምረጡ</p>
        <select id="card-picker"></select>
        <br>
        <button onclick="goToPayment()">ካርቴላውን ይምረጡ</button>
    </div>

    <div id="payment-screen" class="screen">
        <h1>💳 የቴሌብር ክፍያ</h1>
        <p>የመረጡትን ካርቴላ ለመክፈት እባክዎ ክፍያ ይፈጽሙ</p>
        <div class="payment-info">
            የመጫወቻ ዋጋ፦ <b>20 ብር</b><br>
            የቴሌብር ቁጥር፦ <b>0910865908 (ያንተን ቁጥር አስገባው)</b><br>
            ስም፦ <b>አብዱልሰላም ግራኝ</b>
        </div>
        <p>ከፈሉ በኋላ የደረሰኝ ቁጥር (Transaction ID) እዚህ ያስገቡ፦</p>
        <input type="text" id="tx-id" placeholder="ምሳሌ፦ MP12345678">
        <br>
        <button onclick="submitPayment()">ክፍያውን አረጋግጥ</button>
    </div>

    <div id="game-screen" class="screen">
        <h1 id="playing-card-title">ካርቴላ</h1>
        <div class="status-msg">ቁጥሮቹን እየነኩ መምረጥ ይችላሉ!</div>
        
        <div class="header-row">
            <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
        </div>
        <div id="bingo-board" class="bingo-grid"></div>
    </div>
</div>

<script>
    let selectedCardIndex = 1;
    const cardsDatabase = {};

    // 200 የማይደጋገሙ ካርቴላዎችን በህጉ መሰረት በራሱ የሚሰራ ማሽን (Seed-based)
    function generate200Cards() {
        const picker = document.getElementById('card-picker');
        
        for (let c = 1; c <= 200; c++) {
            // ለእያንዳንዱ ካርቴላ የተለየ ቁጥር እንዲወጣ Seed መጠቀም
            let cardMatrix = [];
            let columns = [
                getRange(1, 15),   // B
                getRange(16, 30),  // I
                getRange(31, 45),  // N
                getRange(46, 60),  // G
                getRange(61, 75)   // O
            ];

            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    if (row === 2 && col === 2) {
                        cardMatrix.push('*'); // የመሃሏ ፍሪ ቁጥር
                    } else {
                        cardMatrix.push(columns[col][row]);
                    }
                }
            }
            cardsDatabase[c] = cardMatrix;

            // ወደ ምርጫ ሳጥኑ መጨመር
            let opt = document.createElement('option');
            opt.value = c;
            opt.innerText = "የቢንጎ ካርቴላ #" + c;
            picker.appendChild(opt);
        }
    }

    function getRange(min, max) {
        let arr = [];
        for (let i = min; i <= max; i++) arr.push(i);
        // ቁጥሮቹን በዘፈቀደ ማዘዋወር (Shuffle)
        return arr.sort(() => Math.random() - 0.5).slice(0, 5);
    }

    function goToPayment() {
        selectedCardIndex = document.getElementById('card-picker').value;
        document.getElementById('selection-screen').classList.remove('active');
        document.getElementById('payment-screen').classList.add('active');
    }

    function submitPayment() {
        const txId = document.getElementById('tx-id').value.trim();
        if (txId.length < 5) {
            alert("እባክዎ ትክክለኛ የቴሌብር ደረሰኝ ቁጥር ያስገቡ!");
            return;
        }
        
        // ማሳሰቢያ፦ ለወደፊቱ ከቦቱ ጋር ሙሉ በሙሉ ክፍያውን ለማረጋገጥ እዚህ ጋር ኮድ ይጨመራል
        alert("ክፍያዎ በሂደት ላይ ነው! ወደ ካርቴላዎ እንወስድዎታለን።");
        
        document.getElementById('payment-screen').classList.remove('active');
        renderBingoCard(selectedCardIndex);
        document.getElementById('game-screen').classList.add('active');
    }

    function renderBingoCard(cardId) {
        document.getElementById('playing-card-title').innerText = "የቢንጎ ካርቴላ #" + cardId;
        const board = document.getElementById('bingo-board');
        board.innerHTML = "";
        
        const cardData = cardsDatabase[cardId];

        cardData.forEach((num) => {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.innerText = num;

            if (num === '*') {
                cell.classList.add('free');
            } else {
                cell.onclick = function() {
                    cell.classList.toggle('selected');
                };
            }
            board.appendChild(cell);
        });
    }

    // መጀመሪያ ገጹ ሲከፈት 200 ካርቴላዎችን አውቶማቲክ አምርት
    generate200Cards();
</script>

</body>
</html>
